imports:
    - { resource: "@BitExpertSyliusMinimumOrderValuePlugin/config/config.yaml" }
    - { resource: "services_test.php" }

twig:
    paths:
        '%kernel.project_dir%/../../../tests/TestApplication/templates': ~

sylius_channel:
    resources:
        channel:
            classes:
                model: Tests\BitExpert\SyliusMinimumOrderValuePlugin\Entity\Channel

# Remove if you do not need to extend entities
doctrine:
    orm:
        entity_managers:
            default:
                mappings:
                    TestApplication:
                        is_bundle: false
                        type: attribute
                        dir: '%kernel.project_dir%/../../../tests/TestApplication/src/Entity'
                        prefix: Tests\BitExpert\SyliusMinimumOrderValuePlugin\Entity
