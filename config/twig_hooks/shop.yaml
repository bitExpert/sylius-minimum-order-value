sylius_twig_hooks:
    hooks:
        'sylius_shop.base.offcanvas.cart':
            minimum_order_value_warning:
                template: '@BitExpertSyliusMinimumOrderValuePlugin/shop/cart/_minimum_order_value_warning.html.twig'
                context:
                    remove_radius: true
                priority: 200


        'sylius_shop.cart.index.content.form.sections.general#left':
            minimum_order_value_warning:
                template: '@BitExpertSyliusMinimumOrderValuePlugin/shop/cart/_minimum_order_value_warning.html.twig'
                priority: 300
